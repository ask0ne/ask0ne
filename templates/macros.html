{# back link used by the post page and the 404 page #}
{% macro back(href, label) %}
<a href="{{ href }}" hx-get="{{ href }}" hx-target="#main-content" hx-indicator="#loading" hx-push-url="true" class="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    {{ label }}
</a>
{% endmacro %}
