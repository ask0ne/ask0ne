<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Theme must resolve before first paint to avoid a flash of the wrong theme -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                if (stored === 'dark' || (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {
                // localStorage unavailable (private mode / blocked cookies) — fall back to light
            }
        })();
    </script>

    <!-- SEO Meta Tags -->
    <title>{% block title %}{{ page_title|default('@atharva_kawade') }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ page_description|default('Atharva Kawade is a software developer and AI engineer specializing in web development, automation, and artificial intelligence solutions. Explore my work, thoughts, and projects.') }}{% endblock %}">
    <meta name="keywords" content="{% block keywords %}Atharva Kawade, software developer, AI engineer, web development, automation, artificial intelligence, FastAPI, Python, JavaScript, machine learning{% endblock %}">
    <meta name="author" content="Atharva Kawade">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{% block canonical %}https://atharva-kawade.com{{ canonical_path|default('/') }}{% endblock %}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:url" content="{% block og_url %}https://atharva-kawade.com{{ canonical_path|default('/') }}{% endblock %}">
    <meta property="og:title" content="{% block og_title %}{{ page_title|default('Atharva Kawade - Software Developer & AI Engineer') }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ page_description|default('Software developer and AI engineer specializing in web development, automation, and artificial intelligence solutions.') }}{% endblock %}">
    <meta property="og:image" content="{% block og_image %}https://atharva-kawade.com/assets/images/og-image.jpg{% endblock %}">
    <meta property="og:site_name" content="Atharva Kawade">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{% block twitter_url %}https://atharva-kawade.com{{ canonical_path|default('/') }}{% endblock %}">
    <meta property="twitter:title" content="{% block twitter_title %}{{ page_title|default('Atharva Kawade - Software Developer & AI Engineer') }}{% endblock %}">
    <meta property="twitter:description" content="{% block twitter_description %}{{ page_description|default('Software developer and AI engineer specializing in web development, automation, and artificial intelligence solutions.') }}{% endblock %}">
    <meta property="twitter:image" content="{% block twitter_image %}https://atharva-kawade.com/assets/images/twitter-card.jpg{% endblock %}">
    <meta property="twitter:creator" content="@atharva_kawade">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Performance & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.8"></script>
    <script src="/static/js/contact-utils.js"></script>
    <link rel="stylesheet" href="/assets/css/utilities.css">
    <link rel="stylesheet" href="/assets/css/site.css">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Atharva Kawade",
        "jobTitle": "Software Developer & AI Engineer",
        "description": "Software developer and AI engineer specializing in web development, automation, and artificial intelligence solutions",
        "url": "https://atharva-kawade.com",
        "sameAs": [
            "https://github.com/atharva-kawade",
            "https://linkedin.com/in/atharva-kawade",
            "https://twitter.com/atharva_kawade"
        ],
        "knowsAbout": [
            "Software Development",
            "Artificial Intelligence",
            "Web Development",
            "Automation",
            "Machine Learning",
            "Python",
            "JavaScript",
            "FastAPI"
        ],
        "worksFor": {
            "@type": "Organization",
            "name": "Freelance"
        }
    }
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'primary': {
                            50: '#f0f9ff',
                            500: '#0F7173',
                            600: '#0c5f61',
                            700: '#094e50',
                            900: '#272932'
                        },
                        'accent': {
                            light: '#C2262B',
                            dark: '#D8A47F',
                            muted: '#91A9B4'
                        },
                        'surface': {
                            light: '#E7ECEF',
                            dark: '#272932'
                        }
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-in-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="v2-body min-h-screen transition-colors duration-200 font-sans" data-section="{{ section_id|default('') }}">
    <!-- Navigation -->
    <nav aria-label="Main" class="v2-nav">
        <div class="v2-navin">
            {% for s in ['me', 'work', 'thoughts', 'tangents', 'cv'] %}
            <a href="/{{ s }}" hx-get="/{{ s }}" hx-target="#main-content" hx-indicator="#loading" hx-push-url="true"
                data-section="{{ s }}" class="nav-link lowercase">{{ s }}</a>
            {% endfor %}
            <span class="sp"></span>
            <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme">
                <span aria-hidden="true">(■_■¬)</span>
            </button>
        </div>
    </nav>

    <!-- Loading indicator -->
    <div id="loading" class="htmx-indicator fixed top-20 left-1/2 transform -translate-x-1/2 z-40" role="status">
        <div class="v2-loading"><i aria-hidden="true"></i><span id="loading-verb">loading...</span></div>
    </div>

    <!-- Announces htmx page changes to screen readers -->
    <p id="route-announcer" class="sr-only" role="status" aria-live="polite"></p>

    <!-- Main content -->
    <main id="main-content" tabindex="-1" class="v2-main">
        {% block content %}
        {% if content_template %}
            {% include content_template %}
        {% endif %}
        {% endblock %}
    </main>
<footer class="v2-foot v2-main"><p>built using <b>fastapi</b>, <b>htmx</b> and <b>tailwindcss</b></p></footer>

    <script>
        // Theme management
        const theme = {
            stored() {
                try {
                    return localStorage.getItem('theme');
                } catch (e) {
                    return null;
                }
            },
            persist(value) {
                try {
                    localStorage.setItem('theme', value);
                } catch (e) {
                    // storage blocked — theme still applies for this page view
                }
            },
            sync() {
                const isDark = document.documentElement.classList.contains('dark');
                const btn = document.getElementById('theme-toggle');
                btn.setAttribute('aria-pressed', String(isDark));
                btn.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
            },
            toggle() {
                const isDark = document.documentElement.classList.toggle('dark');
                this.persist(isDark ? 'dark' : 'light');
                this.sync();
            }
        };

        // The `dark` class is already applied by the blocking script in <head>;
        // this only brings the button's accessible state in line with it.
        theme.sync();

        // Follow the OS theme while the page is open, unless the user chose explicitly
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (theme.stored() !== null) return;
            document.documentElement.classList.toggle('dark', e.matches);
            theme.sync();
        });

        // Theme toggle button
        document.getElementById('theme-toggle').addEventListener('click', () => theme.toggle());


        // loading verb: one at random per request
        const loadingVerbs = ['cogitating', 'cooking', 'pondering', 'tinkering', 'marinating', 'percolating', 'noodling',
            'ruminating', 'simmering', 'untangling', 'reticulating', 'brewing', 'conjuring', 'enduring'];
        document.body.addEventListener('htmx:beforeRequest', () => {
            document.getElementById('loading-verb').textContent =
                loadingVerbs[Math.floor(Math.random() * loadingVerbs.length)] + '...';
        });

        // Active state management — drives styling via aria-current, so desktop
        // and mobile links stay in sync from one source of truth.
        function markActiveSection(sectionId) {
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.dataset.section === sectionId) {
                    link.setAttribute('aria-current', 'page');
                } else {
                    link.removeAttribute('aria-current');
                }
            });
        }

        markActiveSection('{{ section_id|default("") }}');

        // htmx skips 4xx responses by default; let the styled 404 swap in
        document.body.addEventListener('htmx:beforeSwap', function (evt) {
            if (evt.detail.xhr.status === 404 && evt.detail.target.id === 'main-content') {
                evt.detail.shouldSwap = true;
                evt.detail.isError = false;
            }
        });

        // htmx swaps only #main-content, so title, canonical URL, focus and the
        // screen-reader announcement all have to be updated by hand.
        document.body.addEventListener('pageMeta', function (evt) {
            const meta = evt.detail;
            document.title = meta.title;

            const description = document.querySelector('meta[name="description"]');
            if (description) description.setAttribute('content', meta.description);

            const canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) canonical.setAttribute('href', 'https://atharva-kawade.com' + meta.path);

            markActiveSection(meta.section_id);

            document.body.dataset.section = meta.section_id;

            const main = document.getElementById('main-content');
            main.focus();
            window.scrollTo(0, 0);

            document.getElementById('route-announcer').textContent = meta.title + ' loaded';
        });
    </script>
</body>

</html>
